<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    {% seo %}
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  </head>
  <body id="top">
    <a class="skip-link" href="#main-content">Skip to content</a>

    <header class="site-header">
      <div class="container header-inner">
        <a class="site-name" href="{{ '/' | relative_url }}">{{ site.title }}</a>
        <nav aria-label="Project">
          <a class="repository-link" href="https://github.com/{{ site.repository }}">View on GitHub <span aria-hidden="true">↗</span></a>
        </nav>
      </div>
    </header>

    <main id="main-content" class="container site-main" tabindex="-1">
      <article class="prose">
        {{ content }}
      </article>
    </main>

    <footer class="site-footer">
      <div class="container footer-inner">
        <p>ConTemp <span aria-hidden="true">·</span> Phaethon Order LLC</p>
        <nav aria-label="Footer">
          <a href="{{ '/LICENSE.html' | relative_url }}">License</a>
          <a href="#top">Back to top <span aria-hidden="true">↑</span></a>
        </nav>
      </div>
    </footer>
  </body>
</html>
